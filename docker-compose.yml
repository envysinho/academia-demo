services:
  db:
    image: postgres:16-alpine
    container_name: academia-demo-db
    environment:
      POSTGRES_DB: academia_demo
      POSTGRES_USER: academia
      POSTGRES_PASSWORD: academia
    ports:
      - "5433:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U academia -d academia_demo"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres-data:
