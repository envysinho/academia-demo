spring:
  application:
    name: academia-demo
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5433/academia_demo}
    username: ${DB_USERNAME:academia}
    password: ${DB_PASSWORD:academia}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: true

server:
  port: ${SERVER_PORT:8081}

app:
  cors:
    allowed-origins: ${APP_CORS_ALLOWED_ORIGINS:http://localhost:5173}
